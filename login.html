<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به پنل مدیریت | گیم‌نت متروگیم</title>
  <link rel="icon" href="src/assets/images/metrogame_emblem_1794207267121.jpg" type="image/jpeg">
  <script>(function(){try{var t=localStorage.getItem('mg_theme_v1');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
  <link href="assets/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/bootstrap/bootstrap-rtl.css" rel="stylesheet">
  <link href="assets/css/gaming-dashboard.css?v=20261110-12" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
  <main class="mg-card" style="max-width: 420px; width: 100%; text-align: center; padding: 34px 28px;">
    <img src="src/assets/images/metrogame_emblem_1794207267121.jpg" alt="لوگوی گیم‌نت متروگیم" class="mg-brand-logo" style="width: 72px; height: 72px; margin-bottom: 14px;">
    <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 6px;">ورود به پنل متروگیم</h1>
    <p style="color: var(--text-secondary); font-size: 13px; margin: 0 0 24px;">سامانه یکپارچه مدیریت میزها، کنسول‌ها و بوفه گیم‌نت</p>

    <form action="index.html" method="get" style="text-align: right;">
      <div class="mg-form-group">
        <label for="loginUsername" class="mg-label">نام کاربری مدیر</label>
        <input type="text" id="loginUsername" class="form-control mg-input" placeholder="admin" value="admin" required>
      </div>
      <div class="mg-form-group">
        <label for="loginPassword" class="mg-label">گذرواژه</label>
        <input type="password" id="loginPassword" class="form-control mg-input" placeholder="••••••••" value="123456" required>
      </div>
      <button type="submit" class="btn btn-primary mg-btn mg-btn-primary mg-btn-block" style="margin-top: 12px;">
        ورود به پیشخوان مدیریت
      </button>
    </form>

    <div style="margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-muted);">
      © تمامی حقوق برای گیم‌نت متروگیم محفوظ است
    </div>
  </main>
  <script type="module" src="JS/dashboard-ui.js?v=20261110-12"></script>
</body>
</html>
